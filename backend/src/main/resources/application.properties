spring.application.name=skillarena-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/SkillArena?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

# Required: set JWT_SECRET to a random value of at least 32 bytes before running.
app.jwt.secret=${JWT_SECRET:CHANGE_THIS_DEVELOPMENT_SECRET_TO_A_RANDOM_32_BYTE_VALUE}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Groq credentials are read from the environment; never commit the key.
groq.api-key=${GROQ_API_KEY:}
groq.api-url=https://api.groq.com/openai/v1
groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
