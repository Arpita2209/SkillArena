
spring.application.name=skillarena-backend

# Database configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/SkillArena?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Server configuration
server.port=${PORT:8080}

# JWT configuration
# Set JWT_SECRET to a secure random value of at least 32 bytes.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Groq AI configuration
groq.api-key=${GROQ_API_KEY:}
groq.api-url=https://api.groq.com/openai/v1
groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
